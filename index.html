@font-face{font-family:"D-DIN";src:url("assets/D-DIN.otf") format("opentype");font-weight:400;font-style:normal;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#687548}
.scene{position:fixed;inset:-8px;overflow:hidden;background:url('assets/background.jpg') center/cover no-repeat;filter:sepia(1) saturate(1.45) hue-rotate(32deg) brightness(.64) contrast(1.12) blur(0);animation:softBlur .8s ease 2.75s forwards}
.world{position:absolute;inset:0;transform:translateY(42vh);animation:pan 3.2s cubic-bezier(.2,.72,.25,1) forwards}
.water{position:absolute;inset:0;background:url('assets/water.png') center bottom/100% 135% no-repeat;z-index:1}
.waves{position:absolute;left:0;right:0;top:64%;bottom:0;z-index:2;overflow:hidden;pointer-events:none}
.wave{position:absolute;height:auto;opacity:.95;left:0;transform:translateX(-120%);animation:drift var(--d) linear infinite;animation-delay:var(--delay)}
.island{position:absolute;inset:0;background:url('assets/island.png') center/cover no-repeat;z-index:3;transform:translateY(1.7vh);pointer-events:none}
@keyframes pan{to{transform:translateY(0)}}
@keyframes softBlur{to{filter:sepia(1) saturate(1.45) hue-rotate(32deg) brightness(.64) contrast(1.12) blur(4px)}}
.title{position:fixed;left:50%;top:50%;z-index:20;margin:0;transform:translate(calc(-50% + var(--ink-shift, 0px)),-78px) scale(.94);opacity:0;color:#fff;font-family:"Dead Island",sans-serif;font-size:clamp(64px,10vw,190px);font-weight:400;line-height:.9;white-space:nowrap;text-align:center;text-shadow:0 4px 18px rgba(0,0,0,.2);pointer-events:none;animation:titleDrop .9s cubic-bezier(.16,.8,.28,1) 2.75s forwards}
@keyframes titleDrop{0%{opacity:0;transform:translate(calc(-50% + var(--ink-shift, 0px)),-78px) scale(.94)}100%{opacity:1;transform:translate(calc(-50% + var(--ink-shift, 0px)),-50%) scale(1)}}
.subtitle{position:fixed;left:50%;top:calc(50% + clamp(62px,8vw,145px));z-index:21;transform:translate(-50%,-18px) scale(.97);opacity:0;color:#fff;font-family:"D-DIN",sans-serif;font-size:clamp(20px,2.2vw,42px);font-weight:400;letter-spacing:.08em;line-height:1;white-space:nowrap;text-align:center;text-shadow:0 3px 12px rgba(0,0,0,.2);pointer-events:none;animation:subtitlePop .7s cubic-bezier(.16,.8,.28,1) 3.15s forwards}
@keyframes subtitlePop{0%{opacity:0;transform:translate(-50%,-18px) scale(.97)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes drift{from{transform:translateX(-120%)}to{transform:translateX(calc(100vw + 120%))}}
</style>
</head>
<body>
<div class="scene"><div class="world"><div class="water"></div><div class="waves" id="waves"></div><div class="island"></div></div></div><h1 class="title">Vast Island</h1><div class="subtitle">Coming soon</div>
<script>
const rows=[
 {y:92,w:340,speed:15,interval:4.8},
 {y:86,w:285,speed:17,interval:4.5},
 {y:80,w:230,speed:19,interval:4.2},
 {y:75,w:180,speed:21,interval:3.9},
 {y:71,w:135,speed:23,interval:3.6},
 {y:68,w:95,speed:25,interval:3.3}
];
const box=document.getElementById('waves');
function build(){
 box.innerHTML=''; const W=innerWidth;
 rows.forEach((r,ri)=>{
   const px=Math.max(60,r.w*W/1920);
   const travel=r.speed;
   const spacing=r.interval;
   /* One lane uses evenly separated phases.  The minimum phase gap is
      calculated from the rendered wave width so two waves in the same
      row can never catch/touch each other. */
   const path=W + px*2.4;
   const minGapTime=(px*1.38/path)*travel;
   const safeSpacing=Math.max(spacing,minGapTime);
   const count=Math.max(3,Math.floor(travel/safeSpacing));
   for(let i=0;i<count;i++){
     const e=document.createElement('img'); e.src='assets/wave.png'; e.className='wave';
     e.style.width=px+'px';
     e.style.top=((r.y-64)/36*100)+'%';
     e.style.setProperty('--d',travel+'s');

     /* At initial page load, populate the water with an already-running
        wave field by starting each animation partway through its cycle.
        After that, every repeat naturally re-enters from the left edge. */
     const phase=(i*(travel/count) + ri*.37) % travel;
     e.style.setProperty('--delay',(-phase)+'s');
     box.appendChild(e);
   }
 });
}
build(); addEventListener('resize',build);

// Visually center the title using the font's actual painted glyph bounds,
// not just the text element's advance width (important for this brush font).
async function centerTitleInk(){
  await document.fonts.ready;
  const title=document.querySelector('.title');
  if(!title) return;
  const cs=getComputedStyle(title);
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  ctx.font=`${cs.fontWeight} ${cs.fontSize} "Dead Island"`;
  const m=ctx.measureText(title.textContent.trim());
  if(Number.isFinite(m.actualBoundingBoxLeft)&&Number.isFinite(m.actualBoundingBoxRight)){
    // Offset between the advance-box center and the actual visible-ink center.
    const inkCenter=(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2 + m.actualBoundingBoxLeft;
    const advanceCenter=m.width/2;
    title.style.setProperty('--ink-shift',`${advanceCenter-inkCenter}px`);
  }
}
centerTitleInk();
addEventListener('resize',centerTitleInk);
</script>
</body>
</html>
